name: Workflow events

on:
  push:
  pull_request:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: show the trigger
        shell: bash
        run: echo "this workflow was triggered by a(n) ${{github.event_name}}"
        